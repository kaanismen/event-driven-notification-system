# One command starts the whole stack: `docker compose up --build` (or `make up`).
# Values in ${...} can be overridden in a local .env file; see .env.example.
name: notifier

services:
  app:
    build: .
    environment:
      DATABASE_URL: postgres://notifier:${POSTGRES_PASSWORD:-notifier}@postgres:5432/notifier?sslmode=disable
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-15s}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-8}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-20}
      # Defaults to the bundled mock provider, so the stack works without a webhook.site
      # account. Set PROVIDER_URL in .env to deliver to webhook.site instead.
      PROVIDER_URL: ${PROVIDER_URL:-http://mockprovider:8081/}
      PROVIDER_TIMEOUT: ${PROVIDER_TIMEOUT:-10s}
      RATE_LIMIT_PER_SECOND: ${RATE_LIMIT_PER_SECOND:-100}
      SENDERS_PER_CHANNEL: ${SENDERS_PER_CHANNEL:-50}
      CLAIM_BATCH_SIZE: ${CLAIM_BATCH_SIZE:-20}
      POLL_INTERVAL: ${POLL_INTERVAL:-250ms}
      LEASE_DURATION: ${LEASE_DURATION:-30s}
      PRIORITY_WEIGHTS: ${PRIORITY_WEIGHTS:-70,20,10}
      RETRY_BASE_DELAY: ${RETRY_BASE_DELAY:-2s}
      RETRY_MAX_DELAY: ${RETRY_MAX_DELAY:-5m}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mockprovider:
        condition: service_started
    restart: unless-stopped
    # Longer than SHUTDOWN_TIMEOUT, so Docker does not kill the app mid-drain.
    stop_grace_period: 20s

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: notifier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notifier}
      POSTGRES_DB: notifier
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/, so the volume
      # is mounted one level up, which also makes future major upgrades possible.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # TCP, not the Unix socket: during first-time init the image runs a socket-only
      # temporary server that would otherwise look "ready" too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U notifier -d notifier"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Stand-in delivery provider (ADR-0013): answers 202 with a unique messageId and logs
  # each request. The default PROVIDER_URL points here; `docker compose logs mockprovider`
  # shows what the workers sent. The MOCK_* settings inject failures (ADR-0014), for
  # example `MOCK_FAILURE_RATE=0.3 docker compose up -d mockprovider`.
  mockprovider:
    build: .
    entrypoint: ["/mockprovider"]
    environment:
      MOCK_ADDR: ":8081"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MOCK_FAIL_FIRST: ${MOCK_FAIL_FIRST:-0}
      MOCK_FAILURE_RATE: ${MOCK_FAILURE_RATE:-0}
      MOCK_FAILURE_STATUS: ${MOCK_FAILURE_STATUS:-503}
      MOCK_RETRY_AFTER: ${MOCK_RETRY_AFTER:-0s}
      MOCK_LATENCY: ${MOCK_LATENCY:-0s}
    restart: unless-stopped

  # Throwaway server for integration tests (ADR-0010). Started only by `make test`
  # through the "test" profile, so `docker compose up` never runs it.
  postgres-test:
    image: postgres:18-alpine
    profiles: ["test"]
    environment:
      POSTGRES_PASSWORD: test
    ports:
      - "${TEST_POSTGRES_PORT:-55432}:5432"
    # Data lives in RAM and durability is switched off: the data is disposable, and this
    # makes create/drop database per test fast.
    tmpfs:
      - /var/lib/postgresql
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
