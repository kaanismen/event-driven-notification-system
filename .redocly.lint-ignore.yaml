# This file instructs Redocly's linter to ignore the rules contained for specific parts of your API.
# See https://redocly.com/docs/cli/ for more information.
# Health checks, metrics and the spec itself take no input, so they have no 4xx response.
api/openapi.yaml:
  operation-4xx-response:
    - '#/paths/~1livez/get/responses'
    - '#/paths/~1health/get/responses'
    - '#/paths/~1readyz/get/responses'
    - '#/paths/~1metrics/get/responses'
    - '#/paths/~1openapi.yaml/get/responses'
  # A WebSocket handshake succeeds with 101 Switching Protocols, never with a 2xx.
  operation-2xx-response:
    - '#/paths/~1v1~1notifications~1{id}~1events/get/responses'
    - '#/paths/~1v1~1batches~1{id}~1events/get/responses'
